<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoLARP</title><link rel="stylesheet" href="popup.css"></head><body><main><header><div class="brand"><div class="logo">R</div><div><b>RoLARP</b><small>Local profile studio</small></div></div><span id="status">●</span></header><nav><button data-tab="profile" class="active">Profile</button><button data-tab="avatar">Avatar</button><button data-tab="inventory">Inventory</button></nav><section id="profile" class="tab"><div class="balance"><small>SIMULATED ROBUX</small><strong id="robux">0</strong><input id="robuxInput" type="number" min="0" placeholder="Balance"><button id="setRobux">Set balance</button></div><label>Username<input id="username" placeholder="LarpUsername"></label><label>Display name<input id="displayName" placeholder="Larp Display"></label><div class="checks"><label><input id="premium" type="checkbox"> Premium</label><label><input id="verified" type="checkbox"> Verified</label></div><label>Followers<input id="followers" type="number" min="0"></label></section><section id="avatar" class="tab hidden"><div class="avatarCard"><div id="avatarHead">🙂</div><b id="avatarName">Larp Display</b><div id="equipped">No simulated items equipped</div></div><button id="clearAvatar">Clear equipped</button></section><section id="inventory" class="tab hidden"><div class="row"><input id="itemName" placeholder="Accessory name"><input id="itemId" placeholder="Asset ID"><button id="addItem">Add</button></div><ul id="items"></ul><p class="hint">Items are simulated locally and never become owned Roblox assets.</p></section><div class="actions"><button id="apply">Apply</button><button id="reset" class="ghost">Reset</button></div><footer>RoLARP changes only your local browser presentation. It does not alter Robux, ownership, accounts, or server data.</footer></main><script src="popup.js"></script></body></html>
